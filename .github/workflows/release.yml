# Zed 汉化版发布工作流（fork 适配版）
#
# 由官方 release.yml 精简改写，移除全部 zed-industries 私有基础设施依赖：
#   - 去掉 repository_owner 白名单限制
#   - 使用 GitHub 官方 runner（ubuntu-latest）替代私有 runner
#   - 去掉 Sentry / Slack / R2 sccache / Azure 签名 / Apple 公证 / 合规检查
#   - 产物均为未签名版（fork 分发无官方证书）
#   - 发布通道：仓库内 RELEASE_CHANNEL 保持 dev（本地开发可与正式版共存），
#     各 bundle job 检出后统一覆盖为 stable
#
# 触发方式：
#   - 推送 v* 标签
#   - 手动触发（workflow_dispatch）
#
# 版本号：与上游 zed-industries/zed 的 main 保持一致（scripts/sync-upstream-version.py）。
# verify_version job 在构建前校验，版本号落后于上游时直接失败，避免发布标签、
# Release 标题与二进制自报版本三者错位。
#
# 仅发布 Linux：Ubuntu/Debian 给 .deb，另外附 tar.gz 与 remote-server 包。
#
# 构建机：ubuntu-latest（GCC ≥ 13，GLIBCXX ≥ 3.4.33）。早前在 ubuntu-22.04
# （GCC 12）上构建，并把构建机的 libstdc++.so.6 打进包里；该副本经 RPATH
# 覆盖系统库，宿主 Mesa 的 Vulkan 驱动（libSPIRV-Tools 需要 GLIBCXX_3.4.32）
# 加载失败，Zed 报 "No GPU adapters found"、窗口打不开，即「非 GCC 12 的 Linux
# 环境无法运行」的 bug。现在 bundle-linux 不再打包 libstdc++，并改用较新的
# 构建机。
#
# 注意：本文件不再由 `cargo xtask workflows` 生成，请勿运行该命令覆盖本文件。
name: release

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建 Linux 安装包，不创建 Release（验证流水线用）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_version:
    name: 校验版本号与上游一致
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验版本号（不落后于上游、与 Cargo.lock 一致、标签一致）
        run: |
          python3 scripts/sync-upstream-version.py --check-not-behind stable
          version="$(python3 scripts/sync-upstream-version.py --print)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 crates/zed/Cargo.toml 的版本号 ${version} 不一致，请对齐后重推标签。" >&2
            exit 1
          fi
          echo "发布版本号：${version}"

  bundle_linux_x86_64:
    name: 构建 Linux x86_64
    needs: verify_version
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # webrtc-sys 的 C++ 代码必须用 clang 17+ 编译（GCC 会把
      # "changes meaning of Network" 当硬错误，且不认识 -Wno-changes-meaning）。
      # ubuntu-latest 自带 clang ≥ 18，直接用发行版包即可。
      CC: clang
      CXX: clang++
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 仓库内 RELEASE_CHANNEL 保持 dev 供本地开发（dev 通道与正式版
      # AppId/配置目录互相独立），发布构建统一覆盖为 stable 通道。
      # 通道经 include_str! 编译进二进制，必须在 cargo 构建前写入。
      - name: 设置发布通道为 stable
        run: echo stable > crates/zed/RELEASE_CHANNEL

      # 复用 rust-toolchain.toml 中固定的工具链版本
      - name: 安装 Rust 工具链
        run: rustup show

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 Linux 系统依赖
        run: ./script/linux

      # clang / lld 用发行版包（ubuntu-latest 自带 clang ≥ 18，满足 clang 17+
      # 要求），避免绑定 apt.llvm.org 的发行版代号。bundle-linux 调用的
      # llvm-objcopy 在发行版包里只有带版本号的名字，这里补一个不带版本号的链接。
      - name: 安装 clang、lld 与 llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          sudo ln -sf "$(ls -d /usr/lib/llvm-*/bin/llvm-objcopy | sort -V | tail -1)" /usr/local/bin/llvm-objcopy

      - name: 下载 wasi-sdk
        run: ./script/download-wasi-sdk

      - name: 打包 Linux
        run: ./script/bundle-linux

      - name: 打包 .deb（Ubuntu/Debian 安装包）
        run: ./script/bundle-linux-deb

      - name: 上传 zed-linux-x86_64.tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: zed-linux-x86_64.tar.gz
          path: target/release/zed-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: 上传 .deb 安装包
        uses: actions/upload-artifact@v4
        with:
          name: zed-zh-cn-linux-x86_64.deb
          path: target/release/zed-zh-cn_*_amd64.deb
          if-no-files-found: error

      - name: 上传 zed-remote-server-linux-x86_64.gz
        uses: actions/upload-artifact@v4
        with:
          name: zed-remote-server-linux-x86_64.gz
          path: target/zed-remote-server-linux-x86_64.gz
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs:
      - verify_version
      - bundle_linux_x86_64
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本号与标签
        id: meta
        run: |
          version="$(script/get-crate-version zed)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # tag 触发使用标签名；手动触发使用 v{版本号}
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 整理产物
        run: |
          mkdir -p release-artifacts
          find ./artifacts -type f -exec mv {} release-artifacts/ \;
          ls -lR release-artifacts

      - name: 生成自动发布说明
        run: |
          # 调用 GitHub generate-notes，遵循 .github/release.yml 的分类配置
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq '.body' > generated-notes.md 2>/dev/null; then
            echo "自动发布说明生成成功"
          else
            echo "自动生成失败，变更列表留空"
            : > generated-notes.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}

      - name: 组装发布说明（固定头部 + 自动列表）
        run: |
          {
            echo "> **Zed 汉化版** — 社区简体中文翻译构建，版本 v${VERSION}。"
            echo ">"
            echo "> ⚠️ **未签名说明**：本构建未经代码签名。"
            echo "> - Ubuntu / Debian：下载 \`zed-zh-cn_<版本>_amd64.deb\`，执行 \`sudo apt install ./zed-zh-cn_<版本>_amd64.deb\`（会自动装依赖）；也可用 \`sudo dpkg -i\` 后补 \`sudo apt -f install\`。"
            echo "> - 其他 Linux：解压 \`zed-linux-x86_64.tar.gz\` 后运行 \`bin/zed\`。"
            echo ""
            echo "---"
            echo ""
            echo "## 变更内容"
            echo ""
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            else
              cat generated-notes.md
            fi
            if [ -s generated-notes.md ]; then
              echo ""
              echo "---"
              echo ""
              cat generated-notes.md
            fi
          } > release-body.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      # softprops 会自动创建或更新 Release 及对应标签
      - name: 创建/更新 Release 并上传资产
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Zed ${{ steps.meta.outputs.version }} (汉化版)
          target_commitish: ${{ github.sha }}
          body_path: release-body.md
          make_latest: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
